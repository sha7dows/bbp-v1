# 用途：关联加权context标准CV5的服务器配置；架构及alpha由命令行显式记录，其他参数沿用归档。
[data]
dataset = vine
processed_path = /root/TRY/data/vine/KbertConfidence/processed/KbertConfidence_data_bert.pt
processed_sha256 = C50F3263CA28D156953414D9E4AD1CCF48FF0045A7867880636F3A2E99339548
expected_sessions = 970
expected_nodes = 68662
expected_features = 768

[split]
test_fraction = 0.20
validation_fraction = 0.00
seeds = 42
stratified = true

[hypergraph]
tau = 0.10
threshold = 0.60
semantic_gate = 0.55
time_weight = 0.50
time_window_seconds = 86400
dedup_mode = subset
dedup_jaccard_tau = 0.90

[model]
hidden_size = 128
dropout = 0.35
num_classes = 2
logit_adjustment = paper
louvain_seed = 42
positive_class_weight = 1.5
confidence_weighting = raw
hgnn_residual = false
edge_pooling = sum
selector_dropout = 0.35
ibg_weight_mode = jaccard

[pruning]
enabled = true
budget_mode = robust_adaptive
retention_ratio = 1.00
candidate_ratios = 1.0,0.9,0.7,0.5,0.3
gumbel_temperature = 1.00
type_embedding_dim = 16
use_ibg_centrality = false
coverage_threshold = 0.90
min_retention_ratio = 0.00
max_retention_ratio = 1.00
coverage_q = 0.20
coverage_tail_gamma = 0.85
coverage_eta = 0.25
lambda_fidelity = 0.5
lambda_comprehensiveness = 0.2
comprehensiveness_margin = 0.1
redundancy_lambda = 0.0

[training]
epochs = 20
batch_size = 64
learning_rate = 0.0001
weight_decay = 0.005
device = cuda:0
gamma_curriculum_enabled = false
gamma_curriculum_start = 0.90
gamma_curriculum_end_epoch = 8
checkpoint_soup_enabled = false
checkpoint_soup_top_k = 3

[cv]
folds = 5
fold_seed = 42

